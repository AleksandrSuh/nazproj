budget_import.import_form:
  path: '/admin/budget/import'
  defaults:
    _form: '\Drupal\budget_import\Form\ImportXlsxForm'
    _title: 'Импорт данных бюджета'
  requirements:
    _permission: 'administer site configuration'

budget_import.view_data:
  path: '/admin/budget/data'
  defaults:
    _controller: '\Drupal\budget_import\Controller\BudgetDataController::viewData'
    _title: 'Просмотр данных бюджета'
  requirements:
    _permission: 'administer site configuration'
